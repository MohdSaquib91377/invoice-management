{% extends "invoice/base/base.html" %}
{% block content %}

<div class="h-100 w-100">
    <div class="row h-100">
        <div class="col-xl-12 col-lg-12 h-100">
            <div class="card shadow mb-4 h-100">
                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                    <label class="m-0 font-weight-bold text-primary">Products</label>
                </div>
                <nav class="navbar navbar-expand w-100 shadow bg-white">
                    <!-- Search Box (Left Side) -->
                    <div class="mr-auto">
                        <form class="form-inline d-none d-sm-inline-block my-2 my-md-0 mw-100 navbar-search">
                            <div class="input-group">
                                <input type="text" name="search" class="form-control border border-primary shadow-sm small rounded-left" 
                                       placeholder="Search..." aria-label="Search" value="{{ request.GET.search }}">
                                <div class="input-group-append">
                                    <button class="btn btn-primary rounded-right" type="submit">
                                        <i class="fas fa-search"></i> <!-- FontAwesome Search Icon -->
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                    

                    <!-- Start Date & End Date (Right Side) -->
                    <form class="d-flex align-items-center ml-auto">
                        <div class="input-group">
                            <input type="date" class="form-control" name="start_date" id="start-date" value="{{ today|date:'Y-m-d' }}">
                            <div class="input-group-text bg-white border-0 px-2">To</div> 
                            <input type="date" class="form-control" name="end_date" id="end-date" value="{{ today|date:'Y-m-d' }}">
                            <div class="input-group-append">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-filter"></i> <!-- FontAwesome Filter Icon -->
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    
                    
                    
                    
                </nav>

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped table-hover" id="dataTable" width="100%" cellspacing="0">
                            <thead class="bg-primary text-white">
                                <tr>
                                    <th style="width: 5%;">ID</th>
                                    <th style="width: 15%;">Date</th>
                                    <th style="width: 60%;">Customer</th>
                                    <th style="width: 30%;">Total</th>
                                    <th style="width: 5%;">Detail</th>
                                    <th style="width: 5%;">Preview</th>
                                    <th style="width: 5%;">Download</th>
                                    <th style="width: 5%;">Delete</th>
                                    <th style="width: 5%;">Edit</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for i in invoice %}
                                <tr class="text-center">
                                    <td>{{ i.id }}</td>
                                    <td>{{ i.date|date:"d/m/Y" }}</td>
                                    <td>{{ i.customer }}</td>
                                    <td>{{ i.total }}</td>
                                    <td>
                                        <a href="{% url 'view_invoice_detail' i.id %}" class="btn btn-outline-primary btn-sm">
                                            <i class="fas fa-long-arrow-alt-right"></i>
                                        </a>
                                    </td>
                                    <td>
                                        <a href="{% url 'preview_invoice' i.id %}" class="btn btn-outline-danger btn-sm">
                                            <i class="fas fa-eye"></i> 
                                        </a>
                                    </td>
                                    <td>
                                        <a href="{% url 'download_invoice' i.id %}" class="btn btn-outline-success btn-sm">
                                            <i class="fas fa-download"></i> 
                                        </a>
                                    </td>
                                    <td>
                                        <a href="{% url 'delete_invoice' i.id %}" class="btn btn-outline-danger btn-sm">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>
                                    <td>
                                        <a href="{% url 'create_invoice' %}?id={{i.id}}" class="btn btn-outline-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% include "pagination.html" %}

{% endblock %}
