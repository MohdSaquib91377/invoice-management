{% extends "invoice/base/base.html" %}
{% block content %}
<div class="container card shadow">
    <form action="{% url 'create_invoice' %}" method="POST">
        {% csrf_token %}
        <div class="mb-3 mt-5">
            <label class="form-label">Customer Name</label>
            <input type="text" name="customer" class="form-control" placeholder="Enter name of the customer" pattern="^[A-Za-z\s]+$" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">

        </div>
        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text" name="contact" class="form-control" placeholder="Enter contact of the customer" pattern="^\d{10}$" maxlength="10" required oninput="this.value = this.value.replace(/\D/g, '')">
        </div>
        <div class="mb-3">
            <label class="form-label">Comments</label>
            <input type="text" name="comments" class="form-control" placeholder="Enter comments">
        </div>

        <!-- Product Table -->
        <div class="table-responsive">
            <table class="table table-bordered" id="invoice-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Amount</th>
                        <th>Quantity</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <input type="text" name="product[]" class="form-control" placeholder="Enter product name" required>
                        </td>
                        <td>
                            <input type="number" name="amount[]" class="form-control amount-field" placeholder="Enter amount" required>
                        </td>
                        <td>
                            <input type="number" name="quantity[]" class="form-control quantity-field" placeholder="Enter quantity" required>
                        </td>
                        <td>
                            <button type="button" class="btn btn-danger remove-row">X</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Buttons -->
        <div class="mb-3 d-flex justify-content-center">
            <button type="button" class="btn btn-outline-warning mx-2 w-50" id="add_more">Add more product</button>
            <input class="btn btn-outline-success mx-2 w-50" type="submit" name="create-invoice" value="Submit">
        </div>
    </form>
</div>

{% endblock %}

{% block custom_js %}
<script>
    document.getElementById("add_more").addEventListener("click", function() {
        let tableBody = document.querySelector("#invoice-table tbody");
        let newRow = document.createElement("tr");
        newRow.innerHTML = `
            <td>
                <input type="text" name="product[]" class="form-control" placeholder="Enter product name" required>
            </td>
            <td>
                <input type="number" name="amount[]" class="form-control amount-field" placeholder="Enter amount" required>
            </td>
            <td>
                <input type="number" name="quantity[]" class="form-control quantity-field" placeholder="Enter quantity" required>
            </td>
            <td>
                <button type="button" class="btn btn-danger remove-row">X</button>
            </td>
        `;
        tableBody.appendChild(newRow);
    });

    // Remove row when "X" button is clicked
    document.addEventListener("click", function(e) {
        if (e.target.classList.contains("remove-row")) {
            e.target.closest("tr").remove();
        }
    });
</script>
{% endblock %}
